<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badminton Online 1v1</title><style>
*{box-sizing:border-box}body{margin:0;background:#09121b;color:#fff;font-family:system-ui,'Malgun Gothic',sans-serif;overflow:hidden}#lobby{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#061421e8}#card{background:#112c3e;border:1px solid #52788d;border-radius:20px;padding:26px;max-width:440px;width:92%;text-align:center;box-shadow:0 20px 80px #0008}button,input{font:inherit;border-radius:9px;padding:11px;border:1px solid #608ca2}button{background:#1b807e;color:white;cursor:pointer;font-weight:700}input{background:#071c2b;color:white;width:130px;text-transform:uppercase;text-align:center}#top{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;background:#071d2bdc;border-radius:12px;padding:9px 22px;pointer-events:none;min-width:270px}#score{font-size:30px;font-weight:800}#status{font-size:12px;color:#c9e7ef}#bottom{position:absolute;left:15px;bottom:15px;background:#071d2bdc;border-radius:12px;padding:12px;line-height:1.7;font-size:12px}#power{position:absolute;right:15px;bottom:15px;background:#071d2bdc;border-radius:12px;padding:12px}#bar{width:140px;height:8px;background:#3b5966;border-radius:9px;margin-top:6px;overflow:hidden}#fill{background:#6af2c6;height:100%;width:0}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:22px;pointer-events:none}#toast{color:#f7db8c;font-size:13px;margin:10px 0}#room{color:#7cf3d6;font-weight:800;font-size:25px;letter-spacing:4px}canvas{display:block}</style></head><body>
<div id="top"><div id="score">0 : 0</div><div id="status">온라인 방에 접속하세요</div></div><div id="cross">+</div><div id="bottom">WASD 이동 · 마우스 시점 · 좌클릭 길게 충전 후 놓기<br>ESC 마우스 해제 · 화면 클릭 재고정 · R 새 경기<br><span id="identity"></span></div><div id="power">파워 <span id="pct">20%</span><div id="bar"><div id="fill"></div></div></div>
<div id="lobby"><div id="card"><h1>🏸 배드민턴 온라인 1v1</h1><p>친구와 같은 방에 접속해 대결하세요.</p><button id="create">방 만들기</button><p>또는 방 코드로 참가</p><input id="code" maxlength="5" placeholder="ABCDE"> <button id="join">참가</button><p id="toast"></p><div id="room"></div><p id="wait"></p><p style="font-size:12px;color:#9fc5d0">게임 서버를 실행해야 접속할 수 있습니다. 한 방에 2명까지 참여할 수 있습니다.</p><button id="play" style="display:none">경기 시작 / 화면 잠금</button></div></div>
<script src="/socket.io/socket.io.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script><script>
const socket=io(),$=id=>document.getElementById(id);let seat=0,joined=false,active=false,world=null,charging=false,chargeAt=0,yaw=0,pitch=0;const keys={};const my={x:0,z:4.7};
$('create').onclick=()=>socket.emit('create');$('join').onclick=()=>socket.emit('join',$('code').value);$('play').onclick=()=>{active=true;$('lobby').style.display='none';renderer.domElement.requestPointerLock?.();};
socket.on('joined',d=>{seat=d.seat;joined=true;my.x=0;my.z=seat===0?4.7:-4.7;yaw=seat===0?0:Math.PI;$('room').textContent=d.code;$('identity').textContent=seat===0?'파랑 플레이어 · 가까운 코트':'주황 플레이어 · 먼 코트';$('wait').textContent='방 코드를 친구에게 알려주세요. 상대가 접속하면 시작할 수 있습니다.';$('toast').textContent='';});
socket.on('ready',()=>{$('wait').textContent='상대가 접속했습니다!';$('play').style.display='inline-block';$('toast').textContent='두 사람이 각자 시작 버튼을 눌러주세요.';});socket.on('notice',s=>$('toast').textContent=s);socket.on('closed',()=>{active=false;joined=false;document.exitPointerLock?.();$('lobby').style.display='grid';$('play').style.display='none';$('wait').textContent='연결이 끊겼습니다. 새 방을 만들어 주세요.';});socket.on('disconnect',()=>{$('status').textContent='서버 연결이 끊겼습니다.';});socket.on('state',s=>{world=s;$('score').textContent=s.score[0]+' : '+s.score[1];$('status').textContent=s.message;});
if(typeof THREE==='undefined'){$('toast').textContent='Three.js를 불러올 수 없습니다. 인터넷 연결을 확인하세요.';throw Error('Three.js missing');}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x152738);scene.fog=new THREE.Fog(0x152738,20,65);const camera=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.05,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x54616b,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-5,13,5);scene.add(sun);
const material=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.72});const green=material(0x11736a),white=material(0xf0f8f5),floor=material(0x455461),dark=material(0x223847);
function block(w,h,d,x,y,z,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);scene.add(mesh);return mesh;}block(70,.1,70,0,-.11,0,floor);block(6.1,.02,13.4,0,.01,0,green);block(70,18,.2,0,9,-24,dark);block(.2,18,50,-19,9,0,dark);block(.2,18,50,19,9,0,dark);
function line(x,z,X,Z){const l=Math.hypot(X-x,Z-z),m=block(.045,.015,l,(x+X)/2,.04,(z+Z)/2,white);m.rotation.y=Math.atan2(X-x,Z-z);}for(const z of [-6.7,6.7,-1.98,1.98])line(-3.05,z,3.05,z);for(const x of [-3.05,3.05,-2.59,2.59])line(x,-6.7,x,6.7);line(0,-6.7,0,-1.98);line(0,1.98,0,6.7);
const net=new THREE.Mesh(new THREE.PlaneGeometry(6.2,1.52),new THREE.MeshBasicMaterial({color:0xe8f2f0,transparent:true,opacity:.3,side:THREE.DoubleSide}));net.position.y=.79;scene.add(net);for(let x=-3;x<=3;x+=.2)block(.006,1.5,.006,x,.78,0,white);for(let y=.1;y<=1.55;y+=.15)block(6.2,.006,.006,0,y,0,white);block(6.3,.035,.04,0,1.55,0,white);
const ball=new THREE.Group();const cork=new THREE.Mesh(new THREE.SphereGeometry(.075,12,8),material(0xf3e8d7));ball.add(cork);for(let i=0;i<10;i++){const a=i*Math.PI/5;const f=new THREE.Mesh(new THREE.ConeGeometry(.045,.27,5),white);f.position.set(Math.cos(a)*.09,.16,Math.sin(a)*.09);ball.add(f);}scene.add(ball);
function avatar(color){const g=new THREE.Group();const shirt=material(color),skin=material(0xd9ab8c),shorts=material(0x203247);function part(parent,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o;}part(g,.48,.66,.27,0,1.26,0,shirt);part(g,.29,.28,.27,0,1.78,0,skin);const head=new THREE.Mesh(new THREE.SphereGeometry(.16,14,12),skin);head.position.y=1.88;g.add(head);part(g,.42,.28,.29,0,.83,0,shorts);for(const x of [-.15,.15]){part(g,.15,.64,.17,x,.42,0,skin);part(g,.20,.12,.3,x,.07,.07,white);}const shoulder=new THREE.Group();shoulder.position.set(.32,1.52,0);g.add(shoulder);part(shoulder,.16,.42,.16,0,-.21,0,skin);const elbow=new THREE.Group();elbow.position.y=-.42;shoulder.add(elbow);part(elbow,.13,.4,.13,0,-.2,0,skin);const racket=new THREE.Group();racket.position.y=-.4;elbow.add(racket);part(racket,.055,.43,.055,0,-.16,0,shorts);const hoop=new THREE.Mesh(new THREE.TorusGeometry(.19,.022,8,24),white);hoop.position.y=-.53;racket.add(hoop);for(let x=-.15;x<=.15;x+=.075)part(racket,.006,.3,.006,x,-.53,0,white);return {g,shoulder,elbow};}
const athletes=[avatar(0x20c3dd),avatar(0xf5a65a)];athletes.forEach(a=>scene.add(a.g));
const localRacket=new THREE.Group();camera.add(localRacket);scene.add(camera);const handle=new THREE.Mesh(new THREE.CylinderGeometry(.022,.027,.4,10),material(0x172b34));handle.position.y=-.2;localRacket.add(handle);const ring=new THREE.Mesh(new THREE.TorusGeometry(.23,.019,8,32),material(0xe5bb61));ring.position.y=.22;localRacket.add(ring);const hand=new THREE.Mesh(new THREE.SphereGeometry(.095,12,8),material(0xd9ab8c));hand.position.y=-.27;localRacket.add(hand);
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR')socket.emit('restart');});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('mousemove',e=>{if(document.pointerLockElement===renderer.domElement){yaw-=e.movementX*.0025;pitch=Math.max(-1.2,Math.min(1.2,pitch-e.movementY*.0025));}});renderer.domElement.addEventListener('mousedown',e=>{if(e.button!==0||!active)return;if(document.pointerLockElement!==renderer.domElement){renderer.domElement.requestPointerLock();return;}charging=true;chargeAt=performance.now();});window.addEventListener('mouseup',e=>{if(e.button!==0||!charging)return;charging=false;const power=Math.min(1,.2+(performance.now()-chargeAt)/550*.8);const dir=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));socket.emit('hit',{power,dir:{x:dir.x,y:dir.y,z:dir.z}});});renderer.domElement.onclick=()=>{if(active&&document.pointerLockElement!==renderer.domElement)renderer.domElement.requestPointerLock();};
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;const power=charging?Math.min(1,.2+(now-chargeAt)/550*.8):.2;$('pct').textContent=Math.round(power*100)+'%';$('fill').style.width=power*100+'%';if(active){const fw=(keys.KeyW?1:0)-(keys.KeyS?1:0),sd=(keys.KeyD?1:0)-(keys.KeyA?1:0),len=Math.hypot(fw,sd)||1;my.x=Math.max(-2.68,Math.min(2.68,my.x+(seat===0?1:-1)*sd/len*4.7*dt));my.z=seat===0?Math.max(.65,Math.min(6.35,my.z-fw/len*4.7*dt)):Math.max(-6.35,Math.min(-.65,my.z+fw/len*4.7*dt));socket.volatile.emit('move',{x:my.x,z:my.z,yaw,pitch});}camera.position.set(my.x,1.68,my.z);camera.rotation.order='YXZ';camera.rotation.set(pitch,yaw,0);localRacket.position.set(.65,-.58,-.92);localRacket.rotation.set(-.45,0,-.25);if(world){const b=world.ball;ball.position.set(b.x,b.y,b.z);world.p.forEach((p,i)=>{athletes[i].g.position.set(p.x,0,p.z);athletes[i].g.rotation.y=i===0?Math.PI:0;athletes[i].g.visible=i!==seat;const t=Math.max(0,Math.min(1,(Date.now()-p.swing)/500));const motion=t<1?Math.sin(t*Math.PI):0;athletes[i].shoulder.rotation.z=-.55-1.15*motion;athletes[i].elbow.rotation.z=-.5-1.3*motion;});}renderer.render(scene,camera);}requestAnimationFrame(frame);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
